stages:
  - verify
  - deploy

default:
  tags:
    - hetzner
    - docker
    - tom2097

verify-production-build:
  stage: verify
  image: node:22-alpine
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm build
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

deploy-to-github:
  stage: deploy
  image: alpine:3.22
  needs:
    - verify-production-build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache git openssh-client
    - install -d -m 700 "$HOME/.ssh"
    - ssh-keyscan github.com > "$HOME/.ssh/known_hosts"
  script:
    - git remote remove github 2>/dev/null || true
    - git remote add github git@github.com:Tom2097/Tom2097.git
    - GIT_SSH_COMMAND="ssh -i /run/secrets/github_mirror_key -o IdentitiesOnly=yes" git push github HEAD:main
