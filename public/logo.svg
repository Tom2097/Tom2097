<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="logo-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon: Geometric "D" in hexagon -->
  <g filter="url(#logo-shadow)">
    <rect x="2" y="4" width="40" height="40" rx="10" fill="url(#logo-grad)"/>
    <!-- Outer hexagon hint -->
    <path d="M10 8h24l8 14-8 14H10l-8-14 8-14z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Stylized "D" letterform -->
    <path d="M14 32V16h5c5.5 0 9 2.5 9 8s-3.5 8-9 8h-5z" fill="white" opacity="0.95"/>
    <path d="M16 18h3c4 0 6.5 2 6.5 6s-2.5 6-6.5 6h-3V18z" fill="url(#logo-grad)"/>
  </g>

  <!-- Wordmark -->
  <text x="54" y="33" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="currentColor" letter-spacing="-0.5">DigiT</text>
  <text x="54" y="45" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="currentColor" opacity="0.5" letter-spacing="2">ENTERPRISE INTELLIGENCE</text>
</svg>
