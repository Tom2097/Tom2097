<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100%">
  <!-- Badge mark: same "D." glyph used in-app (components/digit/logo.tsx) -->
  <defs>
    <linearGradient id="digit-mark-grad" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#3ce0e2"/>
      <stop offset="100%" stop-color="#00a3a8"/>
    </linearGradient>
  </defs>
  <g transform="translate(0, 0)">
    <rect width="100" height="100" rx="24" fill="url(#digit-mark-grad)"/>
    <text x="42" y="68" text-anchor="middle" font-family="'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="58" fill="#052426">D</text>
    <rect x="66" y="58" width="14" height="14" rx="3" fill="#052426"/>
  </g>

  <!-- Wordmark -->
  <text x="126" y="66" font-family="'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="52" fill="#ffffff">DigiT</text>
</svg>
